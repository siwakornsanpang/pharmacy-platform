name: Pharmacy workspace
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pharmacy_test
          POSTGRES_PASSWORD: pharmacy_test
          POSTGRES_DB: pharmacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacy_test -d pharmacy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pharmacy_test:pharmacy_test@localhost:5432/pharmacy_test
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build:shared
      - run: npm run verify:contracts
      - run: npm run verify:http
      - run: npm run check:boundaries
      - run: node --test scripts/tests/boundaries.test.mjs
      - run: npm run test --workspace @pharmacy/contracts
      - run: npm run test --workspace @pharmacy/http
      - run: npm run test --workspace apps/backend-api
        env:
          NODE_ENV: test
      - run: npm run test --workspace apps/backoffice
      - run: npm run test --workspace apps/pharmacy-web
      - run: npm run test:deployment -- tools/deployment/preflight.test.ts
      - run: npm run test:migration -- tools/migration/tests/cutover.test.ts
      - run: npm run typecheck
      - run: npm run build
